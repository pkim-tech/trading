[pytest]
# -n auto: parallelize across CPU cores (pytest-xdist) -- cut the full suite
# from ~15.5min to ~5min (2026-08-10). Every test isolates its own DB via a
# tmp file (DB_PATH override) or tmp_path, confirmed via a full audit before
# this was made the default -- no test touches the real trading_live.db.
# --dist=loadscope: without it, xdist's default --dist=load can schedule two
# tests from the SAME file onto different worker processes concurrently --
# several files share a fixed ticker (e.g. test_entry_abandon.py's
# TEST_ABANDON) and write/read the same real cache/research/{ticker}_1h.csv
# path per test via make_synthetic_csv/cleanup_csv, so a cross-worker race on
# that file caused real, reproducible failures (EmptyDataError, wrong data) --
# 6-12 tests failing across 3/3 runs before this fix, misdiagnosed in the
# backlog as a datetime.now() flakiness issue (found 2026-08-11). loadscope
# keeps all tests in one file on one worker, eliminating the race.
# Override for a single targeted run where -n auto's overhead isn't worth it,
# e.g. `pytest tests/test_foo.py -p no:xdist`.
addopts = -n auto --dist=loadscope
